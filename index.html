<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>untuk devi nur afifah — karya web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:italic,wght@300;400;600&family=Inter:wght@200;400&family=Tenor+Sans&family=Amiri:italic&display=swap" rel="stylesheet">
    <style>
        :root { --cream: #fdfaf5; --sand: #e8d5b7; --brown: #8d7b68; --dark-brown: #63564a; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        body { background: var(--cream); color: var(--dark-brown); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        
        #login-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--cream); transition: 1.5s ease; }
        .login-box { width: 300px; text-align: center; border: 1px solid var(--sand); padding: 40px; border-radius: 2px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--sand); padding: 10px; color: var(--brown); font-size: 10px; letter-spacing: 4px; outline: none; text-align: center; text-transform: uppercase; margin-bottom: 20px; }
        .login-btn { width: 45px; height: 45px; margin: 10px auto 0; background: var(--brown); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #main-content { opacity: 0; display: none; padding-bottom: 100px; }
        body.unlocked #main-content { opacity: 1; display: block; animation: fadeIn 2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .video-frame { border: 15px solid white; box-shadow: 0 20px 40px rgba(141, 123, 104, 0.15); position: relative; }
        .reveal-p { opacity: 0; transform: translateY(30px); transition: 1.5s ease; margin-bottom: 6rem; filter: blur(4px); }
        .reveal-p.active { opacity: 1; transform: translateY(0); filter: blur(0); }
        .scroll-hint { font-size: 8px; letter-spacing: 3px; color: var(--brown); text-transform: uppercase; cursor: pointer; border-bottom: 1px solid var(--sand); padding-bottom: 5px; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="flex flex-col items-center">
            <p class="font-serif italic text-xl mb-8 text-stone-400">assalamu'alaikum...</p>
            <div class="login-box">
                <input type="password" id="password" placeholder="kata sandi">
                <div class="login-btn" onclick="validateLogin()">
                    <svg viewBox="0 0 24 24" width="18" fill="white"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <main class="max-w-[550px] mx-auto px-10 py-24 text-center">
            <header class="mb-20">
                <p class="text-[9px] tracking-[5px] text-stone-400 uppercase">personal project — 2026</p>
                <h1 class="font-serif text-4xl text-stone-700 italic mt-4">For Devi Nur Afifah</h1>
            </header>

            <div class="video-frame mb-32 bg-white p-1">
                <video id="mainVideo" class="w-full" playsinline preload="auto">
                    <source src="video-kamu.mp4" type="video/mp4">
                    browser tidak mendukung video.
                </video>
                <div class="py-6 bg-white">
                    <button id="playBtn" onclick="playVid()" class="bg-stone-800 text-white text-[10px] px-6 py-2 tracking-[3px] uppercase">
                        putar video
                    </button>
                    <p class="font-serif italic text-stone-400 text-xs mt-4">"karya web buatan tangan sendiri"</p>
                </div>
            </div>

            <div class="text-left space-y-28">
                <div class="reveal-p active">
                    <p class="font-serif text-2xl italic text-stone-700 leading-relaxed">
                        assalamu'alaikum, devi nur afifah. halaman ini adalah karya web buatanku sendiri sebagai hasil tes belajar hosting.
                    </p>
                    <span class="scroll-hint" onclick="revealNext(this)">lanjutkan</span>
                </div>
                </div>
        </main>
    </div>

    <script>
        function validateLogin() {
            if (document.getElementById('password').value.toLowerCase() === "satuhati") {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    document.body.classList.add('unlocked');
                    document.getElementById('mainVideo').load();
                }, 1000);
            } else { alert("kata sandi salah."); }
        }

        function playVid() {
            const v = document.getElementById('mainVideo');
            const btn = document.getElementById('playBtn');
            v.play();
            btn.style.display = 'none';
            v.setAttribute("controls","controls"); // munculkan tombol pause/stop setelah jalan
        }

        function revealNext(btn) {
            const next = btn.parentElement.nextElementSibling;
            btn.style.display = 'none';
            if(next) { next.classList.add('active'); next.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }
    </script>
</body>
</html>
