<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>link kadaluarsa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:italic,wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cream: #fdfaf5; --sand: #e8d5b7; --brown: #8d7b68; }
        body { background: var(--cream); margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .f-serif { font-family: 'Cormorant Garamond', serif; }
        
        /* animasi halus munculnya pesan */
        .fade-in { animation: fadeIn 2s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="text-center px-6 fade-in">
        <div class="opacity-40">
            <p class="f-serif italic text-2xl text-stone-600 mb-4">afwan, akses telah berakhir.</p>
            <div class="w-12 h-[1px] bg-stone-400 mx-auto mb-6"></div>
            <p class="text-[9px] tracking-[5px] text-stone-400 uppercase">link ini sudah kadaluarsa dan tidak dapat dibuka kembali</p>
            <p class="text-[8px] tracking-[2px] mt-12 text-stone-300 uppercase italic">personal project — 2026</p>
        </div>
    </div>

    <script>
        // sistem pengunci otomatis:
        // menghapus paksa seluruh sisa-sisa elemen login atau konten jika masih ada di memori browser
        window.onload = function() {
            const forbiddenElements = ['login-screen', 'main-content', 'password'];
            forbiddenElements.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.remove();
            });
            console.log("akses ditutup: link sudah kadaluarsa.");
        };
    </script>
</body>
</html>
